services:
  keycloak:
    container_name: keycloak-1
    image: quay.io/keycloak/keycloak:23.0.7
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME_STRICT: false
      KC_HTTP_PORT: ${KEYCLOAK_HTTP_PORT}
      KC_HEALTH_ENABLED: true

    ports:
      - "${KEYCLOAK_HTTP_PORT}:${KEYCLOAK_HTTP_PORT}"

    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/import:/opt/keycloak/data/import:ro

    networks:
      - internal-net

    depends_on:
      keycloak-db:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - >
          bash -c '
          exec 3<>/dev/tcp/127.0.0.1/${KEYCLOAK_HTTP_PORT};
          printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          head -n 1 <&3 | grep -q "200 OK"
          '
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  keycloak-db:
    container_name: keycloak-db-1
    image: postgres:13-alpine

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - keycloak-db-data:/var/lib/postgresql/data

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

    networks:
      - internal-net

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB

      interval: 5s
      timeout: 3s
      retries: 5

  tasks-db:
    container_name: tasks-db-1
    image: postgres:13-alpine

    environment:
      POSTGRES_DB: ${APP_DB_NAME}
      POSTGRES_USER: ${APP_DB_USER}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD}

    volumes:
      - tasks-data:/var/lib/postgresql/data

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

    networks:
      - internal-net

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB

      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    container_name: backend-1
    build: ./backend

    environment:
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      APP_DB_NAME: ${APP_DB_NAME}
      APP_DB_HOST: ${APP_DB_HOST}
      APP_DB_PORT: ${APP_DB_PORT}
      PORT: 5000
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: http://localhost:8080
      KEYCLOAK_REALM: task-app-realm
      KEYCLOAK_AUDIENCE: task-app-frontend

    ports:
      - "5000:5000"

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

    stop_grace_period: 15s

    networks:
      - internal-net

    depends_on:
      tasks-db:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://localhost:5000/health || exit 1

      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    container_name: frontend-1
    build: ./frontend

    environment:
      VITE_API_BASE_URL: /api2
      VITE_KEYCLOAK_URL: http://localhost:8080
      VITE_KEYCLOAK_REALM: task-app-realm
      VITE_KEYCLOAK_CLIENT_ID: task-app-frontend

    networks:
      - public-net
      - internal-net

    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.125'
          memory: 128M

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:80/ || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    container_name: nginx-1
    build: ./nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.125'
          memory: 128M

    networks:
      - public-net
      - internal-net

    depends_on:
      frontend:
        condition: service_healthy

      backend:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1 || exit 1

      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  keycloak-data:
  keycloak-db-data:
  tasks-data:

networks:
  internal-net:
    driver: bridge

  public-net:
    driver: bridge
